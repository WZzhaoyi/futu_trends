<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screener Results</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
.toolbar input { width: 160px; }
.table-wrap { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 10px; }
thead { position: sticky; top: 0; background: var(--bg); z-index: 1; }
th.sortable { cursor: pointer; user-select: none; }
th.sorted { color: var(--heading); }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--row-hover); }
td.num, th.num { text-align: right; }
td.code { color: var(--heading); }
td.up { color: #ff5252; }
td.dn { color: #00a843; }
.empty { padding: 30px 16px; color: var(--muted); font-size: 13px; }

/* 排序控件：桌面端点表头即可，仅窄屏显示 */
.sort-mobile { display: none; }

/* 窄屏：表格转卡片 */
@media (max-width: 640px) {
  .sort-mobile { display: inline-block; }
  thead { display: none; }
  tr.row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px;
           border-bottom: 1px solid var(--border); padding: 8px 4px; }
  tr.row td { display: flex; justify-content: space-between; border: none; padding: 2px 0; font-size: 12px; }
  tr.row td::before { content: attr(data-label); color: var(--muted); margin-right: 8px; }
  tr.row td.head { grid-column: 1 / -1; justify-content: flex-start; gap: 8px; font-size: 13px; }
  tr.row td.head::before { content: none; }
}
</style>
</head>
<body>
<div class="toolbar">
  <select id="strategy"></select>
  <select id="market"></select>
  <select id="sort-field" class="sort-mobile" title="排序"></select>
  <button id="sort-dir" class="sort-mobile" title="排序方向">↓</button>
  <input id="search" type="text" placeholder="Search code or name...">
  <span id="status">Loading...</span>
  <button id="theme-btn" onclick="cycleTheme()"></button>
</div>
<div class="table-wrap">
  <table>
    <thead><tr id="thead-row"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="empty" hidden></div>
</div>

<script src="/static/theme.js"></script>
<script>
// 列定义：get 取值，num 数值列（右对齐 + 数值排序）；candidate 为平铺结构
const COLUMNS = [
  { key: 'code',  label: '代码',   get: c => c.code },
  { key: 'name',  label: '名称',   get: c => c.name },
  { key: 'price', label: '现价',   num: true, get: c => c.last_price },
  { key: 'chg',   label: '涨跌%',  num: true, get: c => c.change_pct, fmt: v => (v > 0 ? '+' : '') + v.toFixed(2) },
  { key: 'mcap',  label: '市值(亿)', num: true, get: c => c.total_market_val, fmt: v => (v / 1e8).toFixed(1) },
  { key: 'turnover', label: '成交额(亿)', num: true, get: c => c.turnover, fmt: v => (v / 1e8).toFixed(2) },
  { key: 'pe',    label: 'PE',     num: true, get: c => c.pe_ttm_ratio ?? c.pe_ratio },
  { key: 'pb',    label: 'PB',     num: true, get: c => c.pb_ratio },
  { key: 'roe',   label: 'ROE%',   num: true, get: c => c.snapshot_roe },
  { key: 'div',   label: '股息%',  num: true, get: c => c.dividend_ratio_ttm },
];

let available = [];      // /api/screener/list 的 results
let resultDate = null;   // 实际命中的结果日期
let candidates = [];
let sortKey = 'turnover', sortDesc = true;   // 默认按成交额降序；置空则为文件顺序（策略排序）

const $ = id => document.getElementById(id);

function fmtCell(col, c) {
  const v = col.get(c);
  if (v == null) return '-';
  if (col.fmt) return col.fmt(v);
  return col.num ? Number(v).toFixed(2) : v;
}

function syncSortControls() {
  $('sort-field').value = sortKey || '';
  $('sort-dir').textContent = sortDesc ? '↓' : '↑';
}

function applySort() {
  syncSortControls();
  renderHead();
  renderRows();
}

function renderHead() {
  $('thead-row').innerHTML = COLUMNS.map(col => {
    const cls = [col.num ? 'num' : '', 'sortable',
                 col.key === sortKey ? 'sorted' : ''].join(' ').trim();
    const arrow = col.key === sortKey ? (sortDesc ? ' ↓' : ' ↑') : '';
    return `<th class="${cls}" data-key="${col.key}">${col.label}${arrow}</th>`;
  }).join('');
}

function renderRows() {
  const kw = $('search').value.trim().toLowerCase();
  let rows = candidates;
  if (kw) rows = rows.filter(c =>
    c.code.toLowerCase().includes(kw) || (c.name || '').toLowerCase().includes(kw));

  const col = sortKey && COLUMNS.find(c => c.key === sortKey);
  if (col && col.get) {
    rows = [...rows].sort((a, b) => {
      let va = col.get(a), vb = col.get(b);
      if (col.num) { va = va ?? -Infinity; vb = vb ?? -Infinity; return sortDesc ? vb - va : va - vb; }
      return sortDesc ? String(vb).localeCompare(String(va)) : String(va).localeCompare(String(vb));
    });
  }

  $('tbody').innerHTML = rows.map(c => `<tr class="row" data-code="${c.code}">` + COLUMNS.map(col => {
    let cls = col.key === 'code' ? 'code head' : col.key === 'name' ? 'head' : col.num ? 'num' : '';
    if (col.key === 'chg') {
      const v = col.get(c);
      if (v > 0) cls += ' up'; else if (v < 0) cls += ' dn';
    }
    return `<td class="${cls}" data-label="${col.label}">${fmtCell(col, c)}</td>`;
  }).join('') + `</tr>`).join('');
  $('empty').hidden = rows.length > 0;
  $('empty').textContent = candidates.length ? '无匹配结果' : '暂无选股结果，请先运行 screener 定时任务';
}

function fillSelect(el, values, keep) {
  el.innerHTML = values.map(v => `<option value="${v}">${v}</option>`).join('');
  if (keep && values.includes(keep)) el.value = keep;
}

async function loadResult() {
  const strategy = $('strategy').value, market = $('market').value;
  if (!strategy || !market) return;
  $('status').textContent = 'Loading...';
  try {
    const resp = await fetch(`/api/screener/${strategy}/${market}?date=${resultDate}`);
    if (!resp.ok) throw new Error((await resp.json()).detail);
    const data = await resp.json();
    candidates = data.candidates || [];
    $('status').textContent =
      `${data.date} · ${candidates.length}/${data.l1_count} 只 · 生成于 ${data.generated_at || '-'}`;
  } catch (e) {
    candidates = [];
    $('status').textContent = e.message;
  }
  applySort();
}

function onStrategyChange() {
  const markets = [...new Set(available.filter(r => r.strategy === $('strategy').value)
                                       .map(r => r.market))];
  fillSelect($('market'), markets, $('market').value);
  loadResult();
}

async function init() {
  try {
    const resp = await fetch('/api/screener/list');
    const data = await resp.json();
    available = data.results || [];
    resultDate = data.date;
    if (!available.length) {
      $('status').textContent = '';
      renderHead(); renderRows();
      return;
    }
    fillSelect($('strategy'), [...new Set(available.map(r => r.strategy))]);
    onStrategyChange();
  } catch (e) {
    $('status').textContent = e.message;
  }
}

// 移动端排序下拉（桌面端由表头点击代替，二者状态同步）
$('sort-field').innerHTML = '<option value="">策略排序</option>' +
  COLUMNS.filter(c => c.num).map(c => `<option value="${c.key}">${c.label}</option>`).join('');
$('sort-field').addEventListener('change', e => {
  sortKey = e.target.value || null;
  sortDesc = true;
  applySort();
});
$('sort-dir').addEventListener('click', () => { sortDesc = !sortDesc; applySort(); });
syncSortControls();

$('strategy').addEventListener('change', onStrategyChange);
$('market').addEventListener('change', loadResult);
$('search').addEventListener('input', renderRows);
$('tbody').addEventListener('click', e => {
  const row = e.target.closest('tr.row');
  if (row) window.open(`/api/futu/quote/${encodeURIComponent(row.dataset.code)}`,
                       '_blank', 'noopener');
});
$('thead-row').addEventListener('click', e => {
  const th = e.target.closest('th.sortable');
  if (!th) return;
  const key = th.dataset.key;
  if (sortKey === key) sortDesc = !sortDesc;
  else { sortKey = key; sortDesc = true; }
  applySort();
});

init();
</script>
</body>
</html>
