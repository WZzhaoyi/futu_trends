[CONFIG]
# 完成配置后 将模板重命名为config.ini
# 在Telegram申请的bot token
TELEGRAM_BOT_TOKEN=

# 在Telegram创建的频道ID
TELEGRAM_CHAT_ID=

# 在中国大陆境内给Telegram发送消息需要科学上网
# 本脚本支持http代理，请正确配置ip以及端口
# 如果在非中国大陆境内使用，请留空
# http代理格式为:http://127.0.0.1:7890
PROXY=

EMAIL_PORT=587

EMAIL_SERVER=smtp-mail.example.com

EMAIL_SENDER=johndoe@example.com

EMAIL_PASWD=Password13579

EMAIL_SUBSCRIBTION = example1@example.com,example2@example.com

# 数据源 futu yfinance akshare longbridge ibkr
# 全局数据源，当未配置市场专属数据源时使用
DATA_SOURCE=futu

# 按市场前缀分别配置数据源（可选），优先级高于 DATA_SOURCE
# 支持的市场前缀：HK US SH SZ
# DATA_SOURCE_HK=futu
# DATA_SOURCE_US=yfinance
# DATA_SOURCE_SH=akshare
# DATA_SOURCE_SZ=akshare

# Longbridge OpenAPI 配置
# 在 https://open.longbridge.com 申请
# LONGBRIDGE_APP_KEY=
# LONGBRIDGE_APP_SECRET=
# LONGBRIDGE_ACCESS_TOKEN=

# Interactive Brokers (IBKR) 配置
# 需要运行 IB Gateway 或 TWS
# IBKR_HOST=127.0.0.1
# IBKR_PORT=4001

# futuOpenD 部署地址
# 下载问题 https://github.com/FutunnOpen/py-futu-api/issues/137
# 行情权限 https://openapi.futunn.com/futu-api-doc/intro/authority.html#2867
FUTU_HOST=127.0.0.1

# futuOpenD 端口
FUTU_PORT=11111

# 条件单YAML配置路径；示例和功能边界见 orders.example.yaml
# 建议复制 orders.example.yaml 为 orders.yaml 后再启用真实条件单
ORDER_CONFIG=orders.example.yaml

# 条件单全局行情源和订单源；单个条件单可用data_gateway/order_gateway覆盖
ORDER_DATA_GATEWAY=FUTU
# 测试条件触发、订单状态推送和审计日志时可设为SIM；SIM订单源会立即模拟全部成交
ORDER_TRADE_GATEWAY=QMT

# 订单状态和成交回报审计日志，JSONL格式
ORDER_EVENT_LOG=order_events.jsonl

# 条件单触发状态文件：已触发的条件单重启后不再装载，防止重复下单
# 修改对应条件单配置或删除文件中的条目可重新激活
# 同时归档当日终态订单（已成/已撤/废单），用于去重轮询和重启后的重复推送
ORDER_STATE_FILE=order_state.json

# Windows 11 迅投/QMT mini客户端路径和资金账号
QMT_PATH=C:/Users/Administrator/mini_qmt/
QMT_ACCOUNT_ID=

# K线类型 K_DAY K_WEEK K_60M K_HALF_DAY
FUTU_PUSH_TYPE=K_DAY

# futu 自选股集合
FUTU_GROUP=

# 股票代码列表（逗号分隔，与FUTU_GROUP二选一或组合使用）
FUTU_CODE_LIST=HK.00700

# 每个指标的贝叶斯优化独立重启轮数；不配置时使用代码默认值
# 默认：KD/MACD/RSI=20，SR=5
# KD_OPTIMIZATION_RUNS=20
# MACD_OPTIMIZATION_RUNS=20
# RSI_OPTIMIZATION_RUNS=20
# SR_OPTIMIZATION_RUNS=5

# 趋势检测/参数训练类型，支持 kd,macd,rsi,sr,vol；SR 只使用 sr 这个名称
# TREND_TYPE=kd,macd,rsi,sr
# MACD_PARAMS_DB=
# KD_PARAMS_DB=
# RSI_PARAMS_DB=
# SR_PARAMS_DB=

# 飞书电子表格配置（可选）
# 自建应用凭证；也可直接配置 FEISHU_TENANT_ACCESS_TOKEN 临时调试
FEISHU_APP_ID=
FEISHU_APP_SECRET=
# FEISHU_TENANT_ACCESS_TOKEN=

# 飞书电子表格 token，来自表格 URL: https://xxx.feishu.cn/sheets/<token>
FEISHU_SPREADSHEET_TOKEN=

# 日历网格左上角，默认沿用 GOOGLE_SHEET_CELL_ORIGIN；未配置 Google 时默认 B2
FEISHU_SHEET_CELL_ORIGIN=B2

# Webhook 配置（可选）
# Webhook 地址
WEBHOOK_URL=

# 用户内容写入 payload 的字段名（可选，默认 message）
# 示例：POST /hooks/agent 用 message，POST /hooks/wake 用 text
# WEBHOOK_CONTENT_FIELD = message

[WEBHOOK_HEADERS]
# 所有请求头写在这里，包括鉴权 header，新增字段无需修改代码

# 示例：OpenClaw webhook 认证
# x-openclaw-token    = your-hook-token

# 示例：Cloudflare Access 认证
# CF-Access-Client-Id     = your-cf-access-client-id
# CF-Access-Client-Secret = your-cf-access-client-secret

[WEBHOOK_PAYLOAD]
# 所有 payload 字段，新增字段无需修改代码；message 由代码自动附加

# 示例：OpenClaw hooks/agent
# channel        = qqbot
# to             = c2c:YOUR_OPENID
# name           = Notify
# wakeMode       = now
# deliver        = true
# thinking       = low
# timeoutSeconds = 30
