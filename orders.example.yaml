# 条件单配置示例
#
# 使用方式:
# 1. 复制本文件为 orders.yaml
# 2. 在 config.ini 中设置 ORDER_CONFIG=orders.yaml
# 3. 测试订单链路时先使用 order_gateway: SIM
# 4. 确认触发、推送、ORDER_EVENT_LOG 正常后，再切换到 QMT
#
# 当前功能边界:
# - 行情源和订单源可以分别配置:
#   - data_gateway: FUTU
#   - order_gateway: SIM 或 QMT
# - 支持条件组嵌套，logical_operator/operator 支持 AND、OR。
# - 叶子条件比较符按变量类型区分（对齐 IBKR 条件单语义，连续值无相等概念）:
#   数值字段与 datetime 只支持 >、<、>=、<=；
#   signal.* 与字符串字段只支持 ==、!=、contains。
# - 支持 TickData 字段作为变量，例如 datetime、last_price、open_price、high_price、
#   low_price、pre_close、volume、bid_price_1、ask_price_1 等。
#   limit_up/limit_down 不可用: 富途行情无真实涨跌停价（仅有最小价差 price_spread），
#   涨跌停边界请用具体价格数值表达。
# - 支持 signal.* 虚拟变量，复用 trends.py 与 get_kline_data 缓存:
#   signal.breakout 的值就是 trends.py 指标函数返回的信号字符串，可用 contains 做关键词匹配。
#   可用信号: breakout、reverse、continue、top_down、balance。
#   signal 在后台线程计算并缓存30秒，不阻塞行情处理；缓存未就绪时按空字符串参与比较。
# - 条件触发为一次性（对齐 IBKR 条件单语义）: 触发即退休并写入 ORDER_STATE_FILE，
#   动作失败（下单被拒、网关未连接等）只通知、不自动重试，需人工处理。
# - 条件变量名、信号名在启动时校验；data_gateway 必须是能提供行情的网关（FUTU），
#   行情订阅失败会导致启动报错，不会出现"已武装但收不到行情"的状态。
# - datetime 比较值格式必须为: YYYY-MM-DD HH:MM:SS +0800。
# - SIM 是极简订单源: 不看交易时段、不看价格档位，收到订单立即模拟全部成交。
# - QMT 当前只作为订单源使用；免费版行情能力不作为条件单依赖。
# - 订单状态会写入 ORDER_EVENT_LOG，并通过通知链路推送状态变化和成交回报。
#   只跟踪本引擎提交的订单（雪花纯数字 remark 识别）；同账户的人工/其他系统订单完全过滤。
# - cancel.conditions 与下单 conditions 复用同一套条件语法；条件满足时尝试撤销该配置提交的未终态订单。
#   撤单提交失败或订单迟迟未进终态时，每10秒重试一次，最多3次后放弃并通知人工处理
#   （收市废单、已成交、柜台拒绝撤单等场景不会无限重试）。
# - datetime 变量的时区：港股/A股为北京时间，美股为美东时间（与 OpenD 行情推送一致），
#   比较值需自带对应时区偏移，例如美股写 -0400（夏令时）/-0500（冬令时）。
# - 配置采用严格校验：重复 id、trigger_once 等未实现字段都会导致启动失败。
#   symbol 必须加引号（否则 YAML 会解析成数字）；limit 下单必须带 price；
#   datetime 比较值格式在启动时校验；启用订单引用的网关必须已注册。
# - 触发状态持久化到 ORDER_STATE_FILE：已触发的条件单重启后不再装载，防止重复下单；
#   修改该条件单的任何配置内容（哈希变化）会自动重新激活。
# - tick 的 last_price <= 0 时（集合竞价前、坏数据）不评估任何条件，防止止损类条件误触发。
#
# 当前不支持:
# - 条件持续时长，例如“价格保持 5 秒”。
# - 跨订单状态条件，例如“上一笔成交后再下第二笔”。
# - 盘前/盘后/午间休市等交易时段规则校验。
# - 改单、止盈止损联动。
# - 多标的同一条件组，例如“A 上涨且 B 下跌”。
# - QMT 实盘前置风控；真实风控仍以迅投/券商客户端为准。

orders:
  # 示例 1: 收盘也可测试的复合条件。
  # Futu 提供 snapshot/tick，SIM 收到订单后立即成交。
  - id: futu_sim_time_price_smoke
    enabled: false
    description: "FUTU行情 + SIM订单: 时间窗口与价格区间测试"
    symbol: "00700"
    exchange: "HK"
    data_gateway: "FUTU"
    order_gateway: "SIM"
    conditions:
      logical_operator: "AND"
      items:
        - variable: "datetime"
          operator: ">="
          value: "2000-01-01 00:00:00 +0800"
        - variable: "datetime"
          operator: "<="
          value: "2099-12-31 23:59:59 +0800"
        - variable: "last_price"
          operator: ">"
          value: 0
        - variable: "last_price"
          operator: "<"
          value: 999999
    actions:
      - type: "limit"
        action: "buy"
        quantity: 100
        price: 0

  # 示例 2: 嵌套复合条件。
  # 等价于: 时间窗口成立 AND (价格突破上沿 OR 价格跌破下沿)。
  - id: nested_or_price_band
    enabled: false
    description: "嵌套条件: 时间窗口 + 上破/下破"
    symbol: "00700"
    exchange: "HK"
    data_gateway: "FUTU"
    order_gateway: "SIM"
    conditions:
      operator: "AND"
      conditions:
        - variable: "datetime"
          operator: ">="
          value: "2000-01-01 00:00:00 +0800"
        - variable: "datetime"
          operator: "<="
          value: "2099-12-31 23:59:59 +0800"
        - operator: "OR"
          conditions:
            - variable: "last_price"
              operator: ">"
              value: 470
            - variable: "last_price"
              operator: "<"
              value: 450
    actions:
      - type: "notify"
        message: "触发价格区间条件"
      - type: "limit"
        action: "buy"
        quantity: 100
        price: 463.6

  # 示例 3: Futu 行情触发，QMT 订单源下单。
  # 使用前必须确认测试机已登录并连接迅投/miniQMT，QMT_ACCOUNT_ID 配置正确。
  - id: futu_qmt_limit_order
    enabled: false
    description: "FUTU行情 + QMT订单: 限价买入示例"
    symbol: "000001"
    exchange: "SZ"
    data_gateway: "FUTU"
    order_gateway: "QMT"
    conditions:
      logical_operator: "AND"
      items:
        - variable: "datetime"
          operator: ">="
          value: "2000-01-01 00:00:00 +0800"
        - variable: "last_price"
          operator: ">="
          value: 10.5
    actions:
      - type: "limit"
        action: "buy"
        quantity: 100
        price: 10.5
    cancel:
      enabled: false
      conditions:
        logical_operator: "AND"
        items:
          - variable: "datetime"
            operator: ">="
            value: "2099-12-31 09:30:00 +0800"
          - variable: "last_price"
            operator: "<"
            value: 10

  # 示例 4: 复用 trends.py 的突破信号。
  # 数据源、K线周期和缓存由 config.ini / get_kline_data 控制，不在订单YAML重复配置。
  - id: futu_sim_breakout_signal
    enabled: false
    description: "FUTU行情 + trends.py signal.breakout"
    symbol: "000001"
    exchange: "SZ"
    data_gateway: "FUTU"
    order_gateway: "SIM"
    conditions:
      logical_operator: "AND"
      items:
        - variable: "signal.breakout"
          operator: "contains"
          value: "breakthrough"
    actions:
      - type: "notify"
        message: "EMA突破信号触发"
