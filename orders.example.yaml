# 条件单配置
# config.ini: [CONFIG] ORDER_CONFIG=orders.yaml；复制后启用需要的规则。
# 所有示例默认禁用；顶层仅支持orders。
#
# 功能
# - 支持价格、时间、tools.RSI/KDJ/MACD/MA/EMA和signal.*条件。
# - 支持通知、限价/市价买卖和条件撤单；买卖动作只触发一次。
# - notification.mode控制notify动作：一次提醒或每次重新进入条件时提醒。
# - 由Tick驱动；指标按timeframe检查，同一周期不重复计算。
# - 小时窗口从开盘对齐，午休后重新对齐，保留不足整周期的尾部窗口。
# - 支持节假日、半日市、美股夏令时及不同周期的组合条件。
# - Webhook、Telegram、邮件在config.ini中配置，见config_template.ini。
#
# 通用配置项
# id/symbol/exchange/conditions/actions：必填；id唯一，symbol须加引号。
# exchange：SH/SZ/HK/US；enabled：默认false；description：默认省略。
# data_gateway：默认ORDER_DATA_GATEWAY（FUTU），需支持Tick推送。
# order_gateway：交易动作默认ORDER_TRADE_GATEWAY（QMT），可选SIM/QMT；动作可覆盖。
# 纯通知规则仅需行情网关。
# variable/operator/value：条件叶子必填，阈值无默认值。
# params：默认指标参数；timeframe：继承FUTU_PUSH_TYPE（缺省1d）。
# timeframe可选1h/2h/3h/4h/1d/1w，同时决定K线周期和周期结束时的检查时机。
# last_price、volume、datetime等Tick字段逐Tick检查。
# 数值比较：>、<、>=、<=；字符串比较：==、!=、contains。
# 条件组logical_operator：默认AND，可选AND/OR；items可嵌套。
# 条件组也可使用operator: AND/OR + conditions: [...]。
# datetime.value：YYYY-MM-DD HH:MM:SS +0800（美股使用美东时区偏移）。
#
# tools.*默认参数
# RSI：{N: 24}；MA/EMA：{N: 20}；这三个指标不设置output。
# KDJ：{N: 15, M1: 5, M2: 5}；output必填K/D/J。
# MACD：{fast_period: 12, slow_period: 26, signal_period: 9}；output必填DIF/DEA/HIST。
# 周期参数为1到1000的整数；MACD fast_period必须小于slow_period。
# N表示指定timeframe的K线根数。
#
# signal.*默认参数（显式params > 标的参数数据库 > 默认值）
# top_down：{rsi_period: 7, oversold: 30, overbought: 70}。
# reverse：{k_period: 15, d_period: 5, oversold: 50, overbought: 50}。
# continue：{fast_period: 12, slow_period: 26, signal_period: 9, macd_extreme: 150}。
# breakout：{lookback: 80, pivot_window: 3, min_touches: 2, tolerance_atr: 0.35,
#            breakout_buffer_atr: 0.2, volume_ratio: 1.0}。
# balance：{M: 5, N: 28, R: 20}。
# signal.*输出字符串；📈/📉表示偏多/偏空，不设置output。
#
# actions与notification
# actions：非空列表；type可选notify/limit/market，没有默认值。
# notify.message：默认空字符串；发送时补充条件值及指标周期信息。
# notification：默认省略，控制notify动作，需至少一个notify动作。
# notification.mode：默认once；once首次满足后不再通知，on_enter每次重新进入时通知。
# notification.cooldown_seconds：默认60秒，最小0；冷却内再次进入时跳过，不补发。
# on_enter只重复通知；同一规则中的买卖动作和一次性触发状态在重启后仍保留。
# 修改规则配置可重新激活。
# limit/market.action（buy/sell）、quantity：必填；limit.price必填，market.price默认0。
# cancel：默认省略；cancel.enabled默认false，启用后conditions必填。
# ORDER_EVENT_LOG：默认order_events.jsonl；ORDER_STATE_FILE：默认order_state.json。

orders:
- id: hk_kdj_4h_j_once
  enabled: false
  symbol: '00700'
  exchange: HK
  data_gateway: FUTU
  conditions:
    variable: tools.KDJ
    params: {N: 9, M1: 3, M2: 3}
    output: J
    timeframe: 4h
    operator: '>='
    value: 100
  actions:
  - {type: notify, message: 00700 4小时KDJ J>=100}
- id: hk_rsi_1h_oversold
  enabled: false
  symbol: '00700'
  exchange: HK
  conditions:
    variable: tools.RSI
    params: {N: 14}
    timeframe: 1h
    operator: <=
    value: 30
  notification: {mode: on_enter, cooldown_seconds: 3600}
  actions:
  - {type: notify, message: 00700 1小时RSI超卖}
- id: hk_rsi_3h_overbought
  enabled: false
  symbol: '00700'
  exchange: HK
  conditions:
    variable: tools.RSI
    params: {N: 7}
    timeframe: 3h
    operator: '>='
    value: 80
  notification: {mode: on_enter, cooldown_seconds: 1800}
  actions:
  - {type: notify, message: 00700 3小时RSI超买}
- id: us_macd_1h_positive
  enabled: false
  symbol: AAPL
  exchange: US
  conditions:
    variable: tools.MACD
    params: {fast_period: 12, slow_period: 26, signal_period: 9}
    output: HIST
    timeframe: 1h
    operator: '>'
    value: 0
  notification: {mode: on_enter, cooldown_seconds: 3600}
  actions:
  - {type: notify, message: AAPL 1小时MACD柱值为正}
- id: cn_ma_2h
  enabled: false
  symbol: '600000'
  exchange: SH
  conditions:
    variable: tools.MA
    params: {N: 20}
    timeframe: 2h
    operator: '>='
    value: 10
  notification: {mode: on_enter}
  actions:
  - {type: notify, message: 600000 2小时MA>=10}
- id: us_ema_rsi_combination
  enabled: false
  symbol: AAPL
  exchange: US
  conditions:
    logical_operator: AND
    items:
    - variable: tools.EMA
      params: {N: 20}
      timeframe: 4h
      operator: '>='
      value: 200
    - variable: tools.RSI
      params: {N: 14}
      timeframe: 1h
      operator: <=
      value: 30
  notification: {mode: on_enter, cooldown_seconds: 3600}
  actions:
  - {type: notify, message: AAPL EMA与RSI组合满足}
- id: hk_top_down_3h
  enabled: false
  symbol: '00700'
  exchange: HK
  conditions:
    variable: signal.top_down
    params: {rsi_period: 14, oversold: 20, overbought: 80}
    timeframe: 3h
    operator: contains
    value: 📈
  notification: {mode: on_enter, cooldown_seconds: 3600}
  actions:
  - {type: notify, message: 00700 RSI超卖侧信号}
- id: hk_price_band_notice
  enabled: false
  symbol: '00700'
  exchange: HK
  data_gateway: FUTU
  conditions:
    logical_operator: OR
    items:
    - {variable: last_price, operator: '>=', value: 500}
    - {variable: last_price, operator: <=, value: 400}
  actions:
  - {type: notify, message: 00700触发价格区间}
- id: cn_rsi_limit_buy
  enabled: false
  symbol: '600000'
  exchange: SH
  data_gateway: FUTU
  order_gateway: SIM
  conditions:
    logical_operator: AND
    items:
    - {variable: datetime, operator: '>=', value: '2026-10-09 09:30:00 +0800'}
    - {variable: datetime, operator: <=, value: '2026-10-09 14:50:00 +0800'}
    - variable: tools.RSI
      params: {N: 14}
      timeframe: 2h
      operator: <=
      value: 30
  actions:
  - {type: notify, message: 600000 RSI条件触发，提交限价买入}
  - {type: limit, action: buy, quantity: 100, price: 10}
  cancel:
    enabled: true
    conditions: {variable: datetime, operator: '>=', value: '2026-10-09 14:55:00 +0800'}
- id: cn_sr_breakout
  enabled: false
  symbol: '000001'
  exchange: SZ
  data_gateway: FUTU
  conditions: {variable: signal.breakout, operator: contains, value: breakout}
  actions:
  - {type: notify, message: 000001 SR突破信号触发}
